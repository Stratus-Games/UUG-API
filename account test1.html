<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stratus — Apps</title>
<link href="/assets/fonts/css2.css" rel="stylesheet">
<style>
  :root{
    --bg:#050303;
    --bg-2:#0a0505;
    --red:#ff2244;
    --red-hi:#ff5470;
    --red-deep:#7a0f1e;
    --red-dim: rgba(255,34,68,0.35);
    --red-glow: rgba(255,34,68,0.55);
    --card-bg:#0c0808;
    --card-bottom:#12070a;
    --text:#f4e9ea;
    --text-dim:#a98b8d;
    --line: rgba(255,34,68,0.28);
    --gap: 22px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---- Ambient red haze / signature background ---- */
  .haze{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(255,34,68,0.35), transparent 60%),
      radial-gradient(ellipse 45% 35% at 90% 15%, rgba(122,15,30,0.28), transparent 65%),
      radial-gradient(ellipse 50% 40% at 5% 85%, rgba(122,15,30,0.22), transparent 65%),
      linear-gradient(180deg, #050303 0%, #0a0303 40%, #060202 100%);
    animation: hazeShift 14s ease-in-out infinite alternate;
  }
  @keyframes hazeShift{
    0%{filter:brightness(1) saturate(1);}
    100%{filter:brightness(1.18) saturate(1.25);}
  }
  .scanline{
    position:fixed;
    left:0; right:0; top:-10%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--red-hi), transparent);
    box-shadow:0 0 18px 4px var(--red-glow);
    opacity:0.55;
    z-index:1;
    pointer-events:none;
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep{
    0%{ top:-2%; opacity:0;}
    8%{ opacity:.6;}
    50%{ opacity:.35;}
    92%{ opacity:.6;}
    100%{ top:104%; opacity:0;}
  }

  .wrap{ position:relative; z-index:2; max-width:1400px; margin:0 auto; padding:34px 40px 90px; }

  /* ---- Header / search trigger ---- */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:46px;
  }

  .search-trigger{
    flex:0 0 auto;
    width:min(560px, 90vw);
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(180deg,#0d0707,#080404);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 22px;
    cursor:pointer;
    color:var(--text-dim);
    font-family:'Rajdhani',sans-serif;
    font-size:16px;
    letter-spacing:.5px;
    transition:border-color .25s ease, box-shadow .25s ease, color .25s ease;
  }
  .search-trigger:hover{
    border-color:var(--red);
    box-shadow:0 0 22px -4px var(--red-glow);
    color:var(--text);
  }
  .search-trigger svg{ width:18px; height:18px; flex:0 0 auto; }
  .search-trigger .kbd{
    margin-left:auto;
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:2px 7px;
    border-radius:6px;
  }

  /* ---- Section headings ---- */
  .section-title{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:14px;
    margin:0 0 18px 2px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--red-dim), transparent);
  }
  .section-title .tag{ color:var(--red); }

  section{ margin-bottom:56px; }

  /* ---- All apps grid ---- */
  .all-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:var(--gap);
  }

  /* ---- App card: plain square, name only shown on hover ---- */
  .app-card{
    position:relative;
    width:100%;
    max-width:170px;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    background:var(--card-bg);
    border:1px solid rgba(255,34,68,0.16);
    box-shadow:0 6px 18px rgba(0,0,0,0.55);
    transition:border-color .3s ease, box-shadow .3s ease, transform .3s ease;
  }
  .app-card:hover{
    border-color:var(--red);
    box-shadow:0 0 0 1px var(--red-dim), 0 10px 30px rgba(255,34,68,0.22);
    transform:translateY(-3px);
  }
  .app-card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05) contrast(1.03);
    transition:transform .4s ease, filter .4s ease, opacity .3s ease;
  }
  .app-card:hover img{ transform:scale(1.08); filter:saturate(1.15) contrast(1.08) brightness(.55); }

  .app-card .app-name{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.4px;
    color:var(--text);
    background:linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.75));
    opacity:0;
    transition:opacity .25s ease;
  }
  .app-card:hover .app-name{ opacity:1; }

  .empty-state, .loading-state{
    color:var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size:14px;
    padding:30px 4px;
  }

  /* ---- Search overlay ---- */
  .overlay{
    position:fixed; inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,34,68,0.28), transparent 60%),
      rgba(3,1,1,0.94);
    backdrop-filter: blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.active{ opacity:1; pointer-events:auto; }

  .overlay-inner{
    max-width:1100px;
    width:100%;
    margin:0 auto;
    padding:40px 30px 60px;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .overlay-top{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
  }
  .overlay-input{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--red);
    color:var(--text);
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:clamp(20px,3vw,32px);
    letter-spacing:1px;
    padding:8px 4px 14px;
    outline:none;
  }
  .overlay-input::placeholder{ color:var(--text-dim); font-family:'Rajdhani',sans-serif; font-weight:500; }
  .overlay-close{
    background:none; border:1px solid var(--line); color:var(--text);
    width:42px; height:42px; border-radius:50%;
    cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .overlay-close:hover{ border-color:var(--red); color:var(--red-hi); transform:rotate(90deg); }
  .overlay-close svg{ width:18px; height:18px; }

  .overlay-results{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:grid;
    grid-template-columns:repeat(auto-fill, 150px);
    grid-auto-rows:150px;
    justify-content:start;
    justify-items:start;
    align-content:start;
    gap:18px;
    padding-bottom:20px;
  }
  .overlay-results .app-card{
    width:150px;
    max-width:150px;
  }
  .overlay-results::-webkit-scrollbar{ height:8px; }
  .overlay-results::-webkit-scrollbar-thumb{ background:var(--red-deep); border-radius:8px; }
  .overlay-results::-webkit-scrollbar-track{ background:transparent; }
  .overlay-hint{
    color:var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size:13px;
    padding:10px 2px;
  }

  /* ---- App fullscreen frame overlay ---- */
  .frame-overlay{
    position:fixed;
    inset:0;
    z-index:60;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .frame-overlay.active{ opacity:1; pointer-events:auto; }
  .frame-overlay iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .frame-close{
    position:absolute;
    top:16px;
    right:16px;
    z-index:61;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(5,3,3,0.75);
    border:1px solid var(--red);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 20px -4px var(--red-glow);
    transition:transform .2s ease, background .2s ease;
  }
  .frame-close:hover{ background:rgba(255,34,68,0.25); transform:rotate(90deg); }
  .frame-close svg{ width:20px; height:20px; }

  @media (max-width: 640px){
    .wrap{ padding:22px 16px 70px; }
    header{ flex-direction:column; align-items:stretch; }
    .search-trigger{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .haze, .scanline{ animation:none; }
  }
</style>
</head>
<body>

<div class="haze"></div>
<div class="scanline"></div>

<div class="wrap">
  <header>
    <div class="search-trigger" id="searchTrigger" tabindex="0" role="button" aria-label="Open search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search apps…</span>
      <span class="kbd">/</span>
    </div>
  </header>

  <section>
    <h2 class="section-title">All <span class="tag">Apps</span> — A–Z</h2>
    <div class="all-grid" id="allGrid">
      <div class="loading-state">Loading apps…</div>
    </div>
  </section>
</div>

<!-- Search overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-top">
      <input type="text" class="overlay-input" id="overlayInput" placeholder="Type to search…" autocomplete="off">
      <button class="overlay-close" id="overlayClose" aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
      </button>
    </div>
    <div class="overlay-results" id="overlayResults">
      <div class="overlay-hint">Start typing to search apps…</div>
    </div>
  </div>
</div>

<!-- Fullscreen app frame overlay -->
<div class="frame-overlay" id="frameOverlay">
  <button class="frame-close" id="frameClose" aria-label="Close app">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
  </button>
  <iframe id="frameIframe" src="" title="App"></iframe>
</div>

<script>
  const APPS_URL = '/assets/Apps/Apps.json';

  let allApps = [];

  function normalizePath(p){
    if(!p) return '';
    let path = p.trim();
    if(!/\/$/.test(path)) path += '/';
    return path;
  }

  function iconUrl(app){
    // Optional: apps can include their own icon at <path>index.png,
    // fall back to a generated placeholder if it fails to load.
    return normalizePath(app.path) + 'index.png';
  }

  function cardHTML(app){
    const name = (app.name || 'Untitled App').trim();
    const path = normalizePath(app.path);
    const icon = iconUrl(app);
    return `
      <div class="app-card" data-path="${path}" data-name="${name}" tabindex="0" role="button" aria-label="Open ${name}">
        <img src="${icon}" alt="" loading="lazy" onerror="this.style.opacity=0">
        <div class="app-name">${name}</div>
      </div>`;
  }

  function openApp(path, name){
    const frameOverlay = document.getElementById('frameOverlay');
    const iframe = document.getElementById('frameIframe');
    iframe.src = path + 'index.html';
    iframe.title = name || 'App';
    frameOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeApp(){
    const frameOverlay = document.getElementById('frameOverlay');
    const iframe = document.getElementById('frameIframe');
    frameOverlay.classList.remove('active');
    iframe.src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('frameClose').addEventListener('click', closeApp);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && document.getElementById('frameOverlay').classList.contains('active')) closeApp();
  });

  function bindCardClicks(container){
    container.querySelectorAll('.app-card').forEach(card => {
      card.addEventListener('click', () => openApp(card.dataset.path, card.dataset.name));
      card.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openApp(card.dataset.path, card.dataset.name); }
      });
    });
  }

  async function loadAllApps(){
    const grid = document.getElementById('allGrid');
    try{
      const res = await fetch(APPS_URL);
      const data = await res.json();
      allApps = Array.isArray(data) ? data : [];
      const sorted = [...allApps].sort((a, b) =>
        (a.name || '').trim().toLowerCase().localeCompare((b.name || '').trim().toLowerCase())
      );
      grid.innerHTML = sorted.length ? sorted.map(cardHTML).join('') : '<div class="empty-state">No apps found.</div>';
      bindCardClicks(grid);
    }catch(err){
      grid.innerHTML = '<div class="empty-state">Could not load apps. Check your connection and try again.</div>';
    }
  }

  /* ---- Search overlay logic ---- */
  const overlay = document.getElementById('overlay');
  const overlayInput = document.getElementById('overlayInput');
  const overlayResults = document.getElementById('overlayResults');
  const overlayClose = document.getElementById('overlayClose');

  function openOverlay(){
    overlay.classList.add('active');
    setTimeout(() => overlayInput.focus(), 60);
  }
  function closeOverlay(){
    overlay.classList.remove('active');
    overlayInput.value = '';
    overlayResults.innerHTML = '<div class="overlay-hint">Start typing to search apps…</div>';
  }

  document.getElementById('searchTrigger').addEventListener('click', openOverlay);
  document.getElementById('searchTrigger').addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openOverlay(); }
  });
  overlayClose.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
    if(e.key === '/' && !overlay.classList.contains('active') && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault(); openOverlay();
    }
  });

  function runSearch(){
    const q = overlayInput.value.trim().toLowerCase();
    if(!q){
      overlayResults.innerHTML = '<div class="overlay-hint">Start typing to search apps…</div>';
      return;
    }
    const matches = allApps.filter(a => (a.name || '').toLowerCase().includes(q));
    overlayResults.innerHTML = matches.length
      ? matches.map(cardHTML).join('')
      : '<div class="overlay-hint">No matches found.</div>';
    bindCardClicks(overlayResults);
  }
  overlayInput.addEventListener('input', runSearch);

  loadAllApps();
</script>

</body>
</html>

  style.textContent = `
    .radial-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 9998;
    }
    .radial-menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Wrapper stays anchored bottom-right at all times. Movement to/from
       center is handled purely via transform, which CSS can animate
       smoothly (unlike animating between fixed left/right/top/bottom
       values, which snaps because of the "auto" swap). */
    .radial-menu-wrapper {
      position: fixed;
      bottom: ${START_POSITION.bottom};
      right: ${START_POSITION.right};
      width: 60px;
      height: 60px;
      z-index: 9999;
      --black: #000000;
      --night-rider: #2e2e2e;
      --eer-black: #1b1b1b;
      --accent: #ffffff;
      --red: #ff3b30;
      transform: translate(0, 0);
      transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    .radial-menu-trigger { display: none; }

    .radial-menu-circle {
      display: block;
      position: relative;
      z-index: 98;
      height: 60px;
      width: 60px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 3px solid var(--red);
      box-shadow: 0 6px 10px 0 rgba(0,0,0,0.3);
      transition: 0.2s;
      cursor: pointer;
    }
    .radial-menu-circle:active {
      transform: scale(0.9);
    }
    .radial-menu-trigger:checked ~ .radial-menu-circle {
      background-color: rgba(0, 0, 0, 0.55);
    }

    .radial-menu-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .radial-menu-icon .line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      border-radius: 10em;
      background: var(--red);
      transition: transform 700ms ease, opacity 700ms ease, top 700ms ease;
      transition-delay: 0.45s;
    }
    .radial-menu-icon .line-1 { top: 3px; }
    .radial-menu-icon .line-2 { top: 10px; }
    .radial-menu-icon .line-3 { top: 17px; }

    .radial-menu-trigger:checked ~ .radial-menu-circle .radial-menu-icon .line-1 {
      top: 10px;
      transform: rotate(45deg);
    }
    .radial-menu-trigger:checked ~ .radial-menu-circle .radial-menu-icon .line-2 {
      opacity: 0;
    }
    .radial-menu-trigger:checked ~ .radial-menu-circle .radial-menu-icon .line-3 {
      top: 10px;
      transform: rotate(-45deg);
    }

    .radial-menu-subs {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 60px;
      pointer-events: none;
      perspective: 800px;
    }

    /* Sub-circles (72px) with a red outline. Centered inside the 60px wrapper:
       (60-72)/2 = -6px, so the circle's center point stays exactly where it
       was — only the circle itself grows. */
    .radial-menu-sub {
      position: absolute;
      top: -6px;
      left: -6px;
      z-index: 0;
      height: 72px;
      width: 72px;
      border-radius: 50%;
      border: 3px solid var(--red);
      margin: 0;
      padding: 0;
      color: #f3f3f3;
      background-color: var(--eer-black);
      box-shadow: 0 6px 14px 0 rgba(0,0,0,0.35);
      transform: translate(0px, 0px) scale(0.3) rotateY(0deg);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      cursor: pointer;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radial-menu-sub-label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, 6px);
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-family: sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid var(--red);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 5;
    }
    .radial-menu-sub:hover .radial-menu-sub-label {
      opacity: 1;
      transform: translate(-50%, 10px);
    }
    .radial-menu-sub svg {
      width: 32px;
      height: 32px;
      fill: var(--red);
      pointer-events: none;
    }
    .radial-menu-sub:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 6px 14px 0 rgba(0,0,0,0.35);
    }

    .radial-menu-trigger:checked ~ .radial-menu-subs { pointer-events: auto; }
    .radial-menu-trigger:checked ~ .radial-menu-subs .radial-menu-sub { pointer-events: auto; }
    .radial-menu-trigger:checked ~ .radial-menu-subs .radial-menu-mini { pointer-events: auto; }

       of 130px), landing it visually in the gap between the center trigger
       circle and the Games sub-circle. Centered inside the 60px wrapper:
       (60-42)/2 = 9px. Pops out slightly before the main ring. */
    .radial-menu-mini {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 1;
      height: 42px;
      width: 42px;
      border-radius: 50%;
      border: 2px solid var(--red);
      margin: 0;
      padding: 0;
      color: #f3f3f3;
      background-color: var(--eer-black);
      box-shadow: 0 4px 10px 0 rgba(0,0,0,0.35);
      transform: translate(0px, 0px) scale(0.3) rotateY(0deg);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      cursor: pointer;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radial-menu-mini svg {
      width: 20px;
      height: 20px;
      fill: var(--red);
      pointer-events: none;
    }
    .radial-menu-mini img.radial-account-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }
    .radial-menu-mini:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 4px 10px 0 rgba(0,0,0,0.35);
    }
    .radial-menu-mini .radial-menu-sub-label {
      font-size: 11px;
      padding: 3px 7px;
      top: auto;
      bottom: 100%;
      transform: translate(-50%, -6px);
      z-index: 150; /* clear of the center trigger circle's z-index: 98 */
    }
    .radial-menu-mini:hover .radial-menu-sub-label {
      opacity: 1;
      transform: translate(-50%, -10px);
    }
    .radial-menu-trigger:checked ~ .radial-menu-subs .radial-menu-mini {
      transform: translate(43.8px, -43.8px) scale(1) rotateY(720deg);
      opacity: 1;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      transition-delay: 1.05s;
    }

    /* ======================================================================
       Account sub-menu mode — entered by clicking the Account avatar while
       signed in. The 8 main ring items fade out (handled via inline styles
       in JS), the avatar morphs into the center, then this back button and
       secondary ring reveal themselves. Kept as standalone classes (not
       reusing .radial-menu-sub/.radial-menu-mini's :checked selectors) so
       visibility is driven purely by JS toggling ".visible" — no CSS
       specificity fights with the main ring's open/close rules.
       ====================================================================== */
    .radial-menu-backbtn {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 5;
      height: 42px;
      width: 42px;
      border-radius: 50%;
      border: 2px solid var(--red);
      background-color: var(--eer-black);
      box-shadow: 0 4px 10px 0 rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translate(0px, 0px) scale(0.3);
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }
    .radial-menu-backbtn:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 4px 10px 0 rgba(0,0,0,0.35);
    }
    .radial-menu-backbtn.visible {
      opacity: 1;
      transform: translate(43.8px, -43.8px) scale(1);
      pointer-events: auto;
    }
    .radial-menu-backbtn-icon { width: 18px; height: 14px; position: relative; }
    .radial-menu-backbtn-icon span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      border-radius: 10em;
      background: var(--red);
    }
    .radial-menu-backbtn-icon span:nth-child(1) { top: 0; }
    .radial-menu-backbtn-icon span:nth-child(2) { top: 6px; }
    .radial-menu-backbtn-icon span:nth-child(3) { top: 12px; }

    .radial-menu-account-subs {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 60px;
      pointer-events: none;
      perspective: 800px;
    }
    .acc-sub-item {
      position: absolute;
      top: -6px;
      left: -6px;
      z-index: 0;
      height: 72px;
      width: 72px;
      border-radius: 50%;
      border: 3px solid var(--red);

      box-shadow: 0 6px 14px 0 rgba(0,0,0,0.35);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translate(0px, 0px) scale(0.3) rotateY(0deg);
      pointer-events: none;
      cursor: default;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }

      width: 30px;
      height: 30px;

    }
    .acc-sub-item svg path:not([fill]) {
      fill: var(--red);
    }
    .acc-sub-item.acc-sub-active { cursor: pointer; }
    .acc-sub-item.acc-sub-active:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 6px 14px 0 rgba(0,0,0,0.35);
    }
    .acc-sub-item.acc-sub-active:hover .radial-menu-sub-label {
      opacity: 1;
      transform: translate(-50%, 10px);
    }
    .radial-menu-account-subs.visible .acc-sub-item { opacity: 1; }
    .radial-menu-account-subs.visible .acc-sub-item.acc-sub-active { pointer-events: auto; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(1) { transform: translate(0px, -130px) scale(1) rotateY(720deg); transition-delay: 0.00s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(2) { transform: translate(92px, -92px) scale(1) rotateY(720deg); transition-delay: 0.07s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(3) { transform: translate(130px, 0px) scale(1) rotateY(720deg); transition-delay: 0.14s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(4) { transform: translate(92px, 92px) scale(1) rotateY(720deg); transition-delay: 0.21s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(5) { transform: translate(0px, 130px) scale(1) rotateY(720deg); transition-delay: 0.28s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(6) { transform: translate(-92px, 92px) scale(1) rotateY(720deg); transition-delay: 0.35s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(7) { transform: translate(-130px, 0px) scale(1) rotateY(720deg); transition-delay: 0.42s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(8) { transform: translate(-92px, -92px) scale(1) rotateY(720deg); transition-delay: 0.49s; }

    /* ======================================================================

        reader.onerror = reject;
        img.onload = () => {

          canvas.width = Math.round(img.width * scale);

    // ==========================================================================
    // Live notifications socket - lets us receive "a friend is calling" pushes
    // in real time. Reconnects automatically while signed in. Authenticated
    // via ?token= since a browser WebSocket can't carry an Authorization header.
    // ==========================================================================
    let notifySocket = null;
    let notifyReconnectTimer = null;

    function connectNotifications() {
      if (!sessionToken) return;
      if (notifySocket && (notifySocket.readyState === WebSocket.OPEN || notifySocket.readyState === WebSocket.CONNECTING)) return;
      try {
        notifySocket = new WebSocket(`${ACCOUNT_WS_BASE}/api/notifications?token=${encodeURIComponent(sessionToken)}`);
      } catch (e) {
        return;
      }
      notifySocket.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }
        if (msg.type === "call" && msg.data && msg.data.from) {
          handleIncomingCallPush(msg.data.from);
        }
        if (msg.type === "call-declined" && msg.data && msg.data.from === callFriendId && callState === "calling") {
          endCall("Call declined");
        }
      };
      notifySocket.onclose = () => {
        notifySocket = null;
        if (currentUser && !notifyReconnectTimer) {
          notifyReconnectTimer = setTimeout(() => {
            notifyReconnectTimer = null;
            connectNotifications();
          }, 3000);
        }
      };
      notifySocket.onerror = () => {
        try { notifySocket.close(); } catch (err) {}
      };
    }

    function disconnectNotifications() {
      if (notifyReconnectTimer) { clearTimeout(notifyReconnectTimer); notifyReconnectTimer = null; }
      if (notifySocket) { try { notifySocket.close(); } catch (err) {} notifySocket = null; }
    }

    // Small cache of friend name/icon, filled whenever a friends/messages
    // list loads, so an incoming-call banner can show who's calling without
    // an extra round trip most of the time.
    const friendInfoCache = {};
    async function getFriendInfo(friendId) {
      if (friendInfoCache[friendId]) return friendInfoCache[friendId];
      const { ok, data } = await apiFetch("/api/friends");
      if (ok) {
        (data.friends || []).forEach((f) => {
          friendInfoCache[f.userId] = { accountName: f.accountName, icon: f.icon };
        });
      }
      return friendInfoCache[friendId] || { accountName: "Someone", icon: "" };
    }

    // ==========================================================================
    // Voice calls - real WebRTC audio, signaled through the /api/call/:friendId
    // relay (Thread Durable Object). The relay only ever sees SDP offers/
    // answers and ICE candidates; the audio itself flows directly between the
    // two browsers once that handshake completes. Only a STUN server is
    // configured here (no TURN relay), so a call between two networks that
    // both do strict/symmetric NAT can fail to connect - that's a limitation
    // of not having a TURN server, not of the signaling relay itself.
    // ==========================================================================
    const ICE_SERVERS = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
    ];

    let callSocket = null;
    let peerConnection = null;
    let localStream = null;
    let pendingRemoteCandidates = [];
    let callState = "idle"; // idle | calling | ringing | active
    let callFriendId = null;
    let callIsCaller = false;
    let callTimerInterval = null;
    let callStartedAt = null;
    let callMuted = false;
    let callSessionId = 0;
    let incomingCallFromId = null;

    const remoteAudioEl = document.createElement("audio");
    remoteAudioEl.autoplay = true;
    document.body.appendChild(remoteAudioEl);

    // ---- Incoming call banner ----
    const incomingCallBanner = document.createElement("div");
    incomingCallBanner.className = "acct-incoming-call";
    incomingCallBanner.innerHTML = `
      <img id="acctIncomingCallIcon" src="" alt="" />
      <div class="acct-incoming-call-text">
        <div class="acct-incoming-call-name" id="acctIncomingCallName"></div>
        <div class="acct-incoming-call-sub">Incoming call</div>
      </div>
      <div class="acct-incoming-call-actions">
        <button type="button" class="acct-call-decline-btn" id="acctIncomingDeclineBtn">Decline</button>
        <button type="button" class="acct-call-accept-btn" id="acctIncomingAcceptBtn">Accept</button>
      </div>
    `;
    document.body.appendChild(incomingCallBanner);

    incomingCallBanner.querySelector("#acctIncomingAcceptBtn").addEventListener("click", () => {
      hideIncomingCallBanner();
      acceptIncomingCall();
    });
    incomingCallBanner.querySelector("#acctIncomingDeclineBtn").addEventListener("click", () => {
      hideIncomingCallBanner();
      if (incomingCallFromId) {
        apiFetch(`/api/call/${incomingCallFromId}/decline`, { method: "POST" }).catch(() => {});
      }
      incomingCallFromId = null;
    });

    function showIncomingCallBanner(fromId, info) {
      incomingCallFromId = fromId;
      incomingCallBanner.querySelector("#acctIncomingCallName").textContent = info.accountName || "Someone";
      incomingCallBanner.querySelector("#acctIncomingCallIcon").src = info.icon || "";
      incomingCallBanner.classList.add("visible");
    }
    function hideIncomingCallBanner() {
      incomingCallBanner.classList.remove("visible");
    }

    async function handleIncomingCallPush(fromId) {
      // Already on a call - ignore further pings (most commonly the
      // redundant one fired when we ourselves join the relay after accepting).
      if (callState !== "idle") return;
      const info = await getFriendInfo(fromId);
      showIncomingCallBanner(fromId, info);
    }

    // ---- In-call modal (avatar, status, mute/hangup) ----
    const callModalOverlay = document.createElement("div");
    callModalOverlay.className = "acct-modal-overlay";
    callModalOverlay.innerHTML = `
      <div class="acct-modal acct-call-modal" id="acctCallModalInner">
        <div class="acct-call-avatar-wrap">

        <div class="acct-call-controls">
          <button type="button" class="acct-call-ctrl-btn acct-call-mute-btn" id="acctCallMuteBtn" aria-label="Mute">🎤</button>
          <button type="button" class="acct-call-ctrl-btn acct-call-hangup-btn" id="acctCallHangupBtn" aria-label="Hang up">${CALL_ICON_SVG}</button>
        </div>
      </div>
    `;
    document.body.appendChild(callModalOverlay);
    const callModalInner = callModalOverlay.querySelector("#acctCallModalInner");
    const callAvatarEl = callModalOverlay.querySelector("#acctCallAvatar");
    const callNameEl = callModalOverlay.querySelector("#acctCallName");
    const callStatusEl = callModalOverlay.querySelector("#acctCallStatus");
    const callMuteBtnEl = callModalOverlay.querySelector("#acctCallMuteBtn");
    const callHangupBtnEl = callModalOverlay.querySelector("#acctCallHangupBtn");

    callMuteBtnEl.addEventListener("click", toggleMute);
    callHangupBtnEl.addEventListener("click", () => endCall("You hung up"));

    function openCallModal(name, icon) {
      callNameEl.textContent = name || "";
      callAvatarEl.src = icon || "";
      setCallStatus("Calling…", false);
      callMuteBtnEl.classList.remove("acct-call-muted");

      callModalOverlay.classList.add("open");
    }
    function closeCallModal() {
      callModalOverlay.classList.remove("open");

    }

    function setCallStatus(text, active) {
      callStatusEl.textContent = text;
      callStatusEl.classList.toggle("acct-call-active", !!active);
      callModalInner.classList.toggle("acct-call-connecting", !active);
    }

    function startCallTimer() {
      callStartedAt = Date.now();
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - callStartedAt) / 1000);
        const m = String(Math.floor(secs / 60)).padStart(2, "0");
        const s = String(secs % 60).padStart(2, "0");
        setCallStatus(`Connected ${m}:${s}`, true);
      }, 1000);
    }

    function toggleMute() {
      if (!localStream) return;
      callMuted = !callMuted;
      localStream.getAudioTracks().forEach((t) => { t.enabled = !callMuted; });
      callMuteBtnEl.classList.toggle("acct-call-muted", callMuted);
    }

    function createPeerConnection() {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      pc.onicecandidate = (event) => {
        if (event.candidate && callSocket && callSocket.readyState === WebSocket.OPEN) {
          callSocket.send(JSON.stringify({ type: "candidate", candidate: event.candidate }));
        }
      };
      pc.ontrack = (event) => {
        remoteAudioEl.srcObject = event.streams[0];
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected" && callState !== "active") {
          callState = "active";
          startCallTimer();
        }
        if (pc.connectionState === "failed") {
          endCall("Connection failed");
        }
      };
      return pc;
    }

    async function flushPendingCandidates() {
      if (!peerConnection || !peerConnection.remoteDescription) return;
      for (const c of pendingRemoteCandidates) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { /* ignore */ }
      }
      pendingRemoteCandidates = [];
    }

    function openCallSocket(friendId) {
      const socket = new WebSocket(`${ACCOUNT_WS_BASE}/api/call/${friendId}?token=${encodeURIComponent(sessionToken)}`);

      socket.onmessage = async (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }

        if (msg.type === "presence") {
          if (callIsCaller && msg.participants && msg.participants.length === 2 && peerConnection && !peerConnection.localDescription) {
            setCallStatus("Ringing…", false);
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.send(JSON.stringify({ type: "offer", sdp: peerConnection.localDescription }));
          }
          if (msg.participants && msg.participants.length < 2 && callState !== "idle") {
            endCall("Call ended");
          }
          return;
        }

        if (msg.type === "offer" && peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          await flushPendingCandidates();
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.send(JSON.stringify({ type: "answer", sdp: peerConnection.localDescription }));
          return;
        }

        if (msg.type === "answer" && peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          await flushPendingCandidates();
          return;
        }

        if (msg.type === "candidate" && msg.candidate) {
          if (peerConnection && peerConnection.remoteDescription) {
            try { await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (err) { /* ignore */ }
          } else {
            pendingRemoteCandidates.push(msg.candidate);
          }
          return;
        }
      };

      socket.onclose = () => {
        if (callState !== "idle") endCall("Call ended");
      };
      socket.onerror = () => {
        try { socket.close(); } catch (err) {}
      };

      return socket;
    }

    async function startOutgoingCall(friendId, friendName, friendIcon) {
      if (callState !== "idle" || !friendId) return;
      hideIncomingCallBanner();
      const mySession = ++callSessionId;
      callIsCaller = true;
      callState = "calling";
      callFriendId = friendId;
      openCallModal(friendName, friendIcon);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setCallStatus("Microphone access denied", false);
        setTimeout(() => endCall(), 1500);
        return;
      }
      if (callSessionId !== mySession) return; // call was cancelled while awaiting mic permission

      peerConnection = createPeerConnection();
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));
      callSocket = openCallSocket(friendId);

      setTimeout(() => {
        if (callSessionId === mySession && callState === "calling") endCall("No answer");
      }, 30000);
    }

    async function acceptIncomingCall() {
      if (!incomingCallFromId || callState !== "idle") return;
      const friendId = incomingCallFromId;
      incomingCallFromId = null;
      const info = await getFriendInfo(friendId);

      const mySession = ++callSessionId;
      callIsCaller = false;
      callState = "ringing";
      callFriendId = friendId;
      openCallModal(info.accountName, info.icon);
      setCallStatus("Connecting…", false);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setCallStatus("Microphone access denied", false);
        setTimeout(() => endCall(), 1500);
        return;
      }
      if (callSessionId !== mySession) return;

      peerConnection = createPeerConnection();
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));
      callSocket = openCallSocket(friendId);
    }

    function endCall(reason) {
      if (callState === "idle" && !callSocket && !peerConnection) return;
      callSessionId++;
      callState = "idle";
      callIsCaller = false;
      callFriendId = null;
      pendingRemoteCandidates = [];

      if (callSocket) { try { callSocket.close(); } catch (err) {} callSocket = null; }
      if (peerConnection) { try { peerConnection.close(); } catch (err) {} peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      remoteAudioEl.srcObject = null;

      if (reason) {
        setCallStatus(reason, false);
        setTimeout(closeCallModal, 900);
      } else {
        closeCallModal();
      }
    }

    // ---- Signed-in dropdown menu ----
    function renderDropdownMenu() {
      dropdown.innerHTML = "";
      const friendsBtn = document.createElement("button");
      friendsBtn.type = "button";
      friendsBtn.textContent = "Friends";
      friendsBtn.onclick = () => {
        dropdown.classList.remove("open");
        openFriendsModal();
      };
      dropdown.appendChild(friendsBtn);

      const signOutBtn = document.createElement("button");
      signOutBtn.type = "button";
      signOutBtn.className = "acct-danger";
      signOutBtn.textContent = "Sign out";
      signOutBtn.onclick = async () => {
        await apiFetch("/api/logout", { method: "POST" });
        setSessionToken(null);
        currentUser = null;
        dropdown.classList.remove("open");
        closeChatModal();
        closeMessagesModal();
        closeFriendsModal();
        hideIncomingCallBanner();
        endCall();
        disconnectNotifications();
        render();
      };
      dropdown.appendChild(signOutBtn);
    }

    function toggleDropdown() {
      if (dropdown.classList.contains("open")) {
        dropdown.classList.remove("open");
        return;
      }
      renderDropdownMenu();
      dropdown.classList.add("open");
    }

    document.addEventListener("click", (e) => {
      if (!widget.contains(e.target)) dropdown.classList.remove("open");
    });

    button.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentUser) {
        toggleDropdown();
      } else {
        dropdown.classList.remove("open");
        renderLoginForm();
        openModal();
      }
    });

    // ---- Render (top-right pill + radial menu account mini-button) ----
    function render() {
      if (currentUser) {
        button.innerHTML = `
          <span class="acct-label">${escapeHtml(currentUser.accountName)}</span>
          <img class="acct-avatar" src="${currentUser.icon}" alt="" />
        `;
      } else {
        button.innerHTML = `<span class="acct-label">Sign in</span>`;
        dropdown.classList.remove("open");
      }

      const tooltip = accountMiniBtn.querySelector(".radial-menu-sub-label");
      if (currentUser) {
        accountMiniBtn.innerHTML = `<img class="radial-account-avatar" src="${currentUser.icon}" alt="" />`;
        accountMiniBtn.setAttribute("aria-label", currentUser.accountName);
      } else {
        accountMiniBtn.innerHTML = ACCOUNT_ICON_SVG;
        accountMiniBtn.setAttribute("aria-label", "Account");
      }
      if (tooltip) accountMiniBtn.appendChild(tooltip);
      else {
        const t = document.createElement("span");
        t.className = "radial-menu-sub-label";
        t.textContent = currentUser ? currentUser.accountName : "Account";
        accountMiniBtn.appendChild(t);
      }
    }

    function handleRadialClick() {
      if (currentUser) {
        enterAccountMode(); // outer-scope function — fades the ring, morphs the avatar to center
      } else {
        renderLoginForm();
        openModal();
      }
    }

    async function init() {
      if (!sessionToken) {
        currentUser = null;
        render();
        return;
      }
      const { ok, data } = await apiFetch("/api/me");
      if (ok) {
        currentUser = data.profile;
      } else {
        currentUser = null;
        setSessionToken(null); // stale/expired token — drop it so we don't keep retrying
      }
      render();
      if (currentUser) connectNotifications();
    }

    init();

    return { handleRadialClick, openFriendsModal, openMessagesModal, isSignedIn: () => !!currentUser };
  })();
})();
</script>
