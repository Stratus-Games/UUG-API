
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stratus — Acalllshjn</title>
<link href="/assets/fonts/css2.css" rel="stylesheet">
<style>
  :root{
    --bg:#050303;
    --bg-2:#0a0505;
    --red:#ff2244;
    --red-hi:#ff5470;
    --red-deep:#7a0f1e;
    --red-dim: rgba(255,34,68,0.35);
    --red-glow: rgba(255,34,68,0.55);
    --card-bg:#0c0808;
    --card-bottom:#12070a;
    --text:#f4e9ea;
    --text-dim:#a98b8d;
    --line: rgba(255,34,68,0.28);
    --gap: 22px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---- Ambient red haze / signature background ---- */
  .haze{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(255,34,68,0.35), transparent 60%),
      radial-gradient(ellipse 45% 35% at 90% 15%, rgba(122,15,30,0.28), transparent 65%),
      radial-gradient(ellipse 50% 40% at 5% 85%, rgba(122,15,30,0.22), transparent 65%),
      linear-gradient(180deg, #050303 0%, #0a0303 40%, #060202 100%);
    animation: hazeShift 14s ease-in-out infinite alternate;
  }
  @keyframes hazeShift{
    0%{filter:brightness(1) saturate(1);}
    100%{filter:brightness(1.18) saturate(1.25);}
  }
  .scanline{
    position:fixed;
    left:0; right:0; top:-10%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--red-hi), transparent);
    box-shadow:0 0 18px 4px var(--red-glow);
    opacity:0.55;
    z-index:1;
    pointer-events:none;
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep{
    0%{ top:-2%; opacity:0;}
    8%{ opacity:.6;}
    50%{ opacity:.35;}
    92%{ opacity:.6;}
    100%{ top:104%; opacity:0;}
  }

  .wrap{ position:relative; z-index:2; max-width:1400px; margin:0 auto; padding:34px 40px 90px; }

  /* ---- Header / search trigger ---- */
  header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:46px;
  }

  .search-trigger{
    flex:0 0 auto;
    width:min(560px, 90vw);
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(180deg,#0d0707,#080404);
    border:1px solid var(--line);
    border-radius:999px;
    padding:12px 22px;
    cursor:pointer;
    color:var(--text-dim);
    font-family:'Rajdhani',sans-serif;
    font-size:16px;
    letter-spacing:.5px;
    transition:border-color .25s ease, box-shadow .25s ease, color .25s ease;
  }
  .search-trigger:hover{
    border-color:var(--red);
    box-shadow:0 0 22px -4px var(--red-glow);
    color:var(--text);
  }
  .search-trigger svg{ width:18px; height:18px; flex:0 0 auto; }
  .search-trigger .kbd{
    margin-left:auto;
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:2px 7px;
    border-radius:6px;
  }

  /* ---- Section headings ---- */
  .section-title{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:14px;
    margin:0 0 18px 2px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--red-dim), transparent);
  }
  .section-title .tag{ color:var(--red); }

  section{ margin-bottom:56px; }

  /* ---- All apps grid ---- */
  .all-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:var(--gap);
  }

  /* ---- App card: plain square, name only shown on hover ---- */
  .app-card{
    position:relative;
    width:100%;
    max-width:170px;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    background:var(--card-bg);
    border:1px solid rgba(255,34,68,0.16);
    box-shadow:0 6px 18px rgba(0,0,0,0.55);
    transition:border-color .3s ease, box-shadow .3s ease, transform .3s ease;
  }
  .app-card:hover{
    border-color:var(--red);
    box-shadow:0 0 0 1px var(--red-dim), 0 10px 30px rgba(255,34,68,0.22);
    transform:translateY(-3px);
  }
  .app-card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05) contrast(1.03);
    transition:transform .4s ease, filter .4s ease, opacity .3s ease;
  }
  .app-card:hover img{ transform:scale(1.08); filter:saturate(1.15) contrast(1.08) brightness(.55); }

  .app-card .app-name{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.4px;
    color:var(--text);
    background:linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.75));
    opacity:0;
    transition:opacity .25s ease;
  }
  .app-card:hover .app-name{ opacity:1; }

  .empty-state, .loading-state{
    color:var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size:14px;
    padding:30px 4px;
  }

  /* ---- Search overlay ---- */
  .overlay{
    position:fixed; inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,34,68,0.28), transparent 60%),
      rgba(3,1,1,0.94);
    backdrop-filter: blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.active{ opacity:1; pointer-events:auto; }

  .overlay-inner{
    max-width:1100px;
    width:100%;
    margin:0 auto;
    padding:40px 30px 60px;
    display:flex;
    flex-direction:column;
    height:100%;
  }
  .overlay-top{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
  }
  .overlay-input{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--red);
    color:var(--text);
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:clamp(20px,3vw,32px);
    letter-spacing:1px;
    padding:8px 4px 14px;
    outline:none;
  }
  .overlay-input::placeholder{ color:var(--text-dim); font-family:'Rajdhani',sans-serif; font-weight:500; }
  .overlay-close{
    background:none; border:1px solid var(--line); color:var(--text);
    width:42px; height:42px; border-radius:50%;
    cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .overlay-close:hover{ border-color:var(--red); color:var(--red-hi); transform:rotate(90deg); }
  .overlay-close svg{ width:18px; height:18px; }

  .overlay-results{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:grid;
    grid-template-columns:repeat(auto-fill, 150px);
    grid-auto-rows:150px;
    justify-content:start;
    justify-items:start;
    align-content:start;
    gap:18px;
    padding-bottom:20px;
  }
  .overlay-results .app-card{
    width:150px;
    max-width:150px;
  }
  .overlay-results::-webkit-scrollbar{ height:8px; }
  .overlay-results::-webkit-scrollbar-thumb{ background:var(--red-deep); border-radius:8px; }
  .overlay-results::-webkit-scrollbar-track{ background:transparent; }
  .overlay-hint{
    color:var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size:13px;
    padding:10px 2px;
  }

  /* ---- App fullscreen frame overlay ---- */
  .frame-overlay{
    position:fixed;
    inset:0;
    z-index:60;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .frame-overlay.active{ opacity:1; pointer-events:auto; }
  .frame-overlay iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .frame-close{
    position:absolute;
    top:16px;
    right:16px;
    z-index:61;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(5,3,3,0.75);
    border:1px solid var(--red);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 20px -4px var(--red-glow);
    transition:transform .2s ease, background .2s ease;
  }
  .frame-close:hover{ background:rgba(255,34,68,0.25); transform:rotate(90deg); }
  .frame-close svg{ width:20px; height:20px; }

  @media (max-width: 640px){
    .wrap{ padding:22px 16px 70px; }
    header{ flex-direction:column; align-items:stretch; }
    .search-trigger{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .haze, .scanline{ animation:none; }
  }
</style>
</head>
<body>

<div class="haze"></div>
<div class="scanline"></div>

<div class="wrap">
  <header>
    <div class="search-trigger" id="searchTrigger" tabindex="0" role="button" aria-label="Open search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search apps…</span>
      <span class="kbd">/</span>
    </div>
  </header>

  <section>
    <h2 class="section-title">All <span class="tag">Apps</span> — A–Z</h2>
    <div class="all-grid" id="allGrid">
      <div class="loading-state">Loading apps…</div>
    </div>
  </section>
</div>

<!-- Search overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-top">
      <input type="text" class="overlay-input" id="overlayInput" placeholder="Type to search…" autocomplete="off">
      <button class="overlay-close" id="overlayClose" aria-label="Close search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
      </button>
    </div>
    <div class="overlay-results" id="overlayResults">
      <div class="overlay-hint">Start typing to search apps…</div>
    </div>
  </div>
</div>

<!-- Fullscreen app frame overlay -->
<div class="frame-overlay" id="frameOverlay">
  <button class="frame-close" id="frameClose" aria-label="Close app">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
  </button>
  <iframe id="frameIframe" src="" title="App"></iframe>
</div>

<script>
  const APPS_URL = '/assets/Apps/Apps.json';

  let allApps = [];

  function normalizePath(p){
    if(!p) return '';
    let path = p.trim();
    if(!/\/$/.test(path)) path += '/';
    return path;
  }

  function iconUrl(app){
    // Optional: apps can include their own icon at <path>index.png,
    // fall back to a generated placeholder if it fails to load.
    return normalizePath(app.path) + 'index.png';
  }

  function cardHTML(app){
    const name = (app.name || 'Untitled App').trim();
    const path = normalizePath(app.path);
    const icon = iconUrl(app);
    return `
      <div class="app-card" data-path="${path}" data-name="${name}" tabindex="0" role="button" aria-label="Open ${name}">
        <img src="${icon}" alt="" loading="lazy" onerror="this.style.opacity=0">
        <div class="app-name">${name}</div>
      </div>`;
  }

  function openApp(path, name){
    const frameOverlay = document.getElementById('frameOverlay');
    const iframe = document.getElementById('frameIframe');
    iframe.src = path + 'index.html';
    iframe.title = name || 'App';
    frameOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeApp(){
    const frameOverlay = document.getElementById('frameOverlay');
    const iframe = document.getElementById('frameIframe');
    frameOverlay.classList.remove('active');
    iframe.src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('frameClose').addEventListener('click', closeApp);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && document.getElementById('frameOverlay').classList.contains('active')) closeApp();
  });

  function bindCardClicks(container){
    container.querySelectorAll('.app-card').forEach(card => {
      card.addEventListener('click', () => openApp(card.dataset.path, card.dataset.name));
      card.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openApp(card.dataset.path, card.dataset.name); }
      });
    });
  }

  async function loadAllApps(){
    const grid = document.getElementById('allGrid');
    try{
      const res = await fetch(APPS_URL);
      const data = await res.json();
      allApps = Array.isArray(data) ? data : [];
      const sorted = [...allApps].sort((a, b) =>
        (a.name || '').trim().toLowerCase().localeCompare((b.name || '').trim().toLowerCase())
      );
      grid.innerHTML = sorted.length ? sorted.map(cardHTML).join('') : '<div class="empty-state">No apps found.</div>';
      bindCardClicks(grid);
    }catch(err){
      grid.innerHTML = '<div class="empty-state">Could not load apps. Check your connection and try again.</div>';
    }
  }

  /* ---- Search overlay logic ---- */
  const overlay = document.getElementById('overlay');
  const overlayInput = document.getElementById('overlayInput');
  const overlayResults = document.getElementById('overlayResults');
  const overlayClose = document.getElementById('overlayClose');

  function openOverlay(){
    overlay.classList.add('active');
    setTimeout(() => overlayInput.focus(), 60);
  }
  function closeOverlay(){
    overlay.classList.remove('active');
    overlayInput.value = '';
    overlayResults.innerHTML = '<div class="overlay-hint">Start typing to search apps…</div>';
  }

  document.getElementById('searchTrigger').addEventListener('click', openOverlay);
  document.getElementById('searchTrigger').addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openOverlay(); }
  });
  overlayClose.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
    if(e.key === '/' && !overlay.classList.contains('active') && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault(); openOverlay();
    }
  });

  function runSearch(){
    const q = overlayInput.value.trim().toLowerCase();
    if(!q){
      overlayResults.innerHTML = '<div class="overlay-hint">Start typing to search apps…</div>';
      return;
    }
    const matches = allApps.filter(a => (a.name || '').toLowerCase().includes(q));
    overlayResults.innerHTML = matches.length
      ? matches.map(cardHTML).join('')
      : '<div class="overlay-hint">No matches found.</div>';
    bindCardClicks(overlayResults);
  }
  overlayInput.addEventListener('input', runSearch);

  loadAllApps();
</script>

</body>
</html>

  style.textContent = `
    .radial-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 9998;
    }
    .radial-menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Wrapper stays anchored bottom-right at all times. Movement to/from
       center is handled purely via transform, which CSS can animate
       smoothly (unlike animating between fixed left/right/top/bottom
       values, which snaps because of the "auto" swap). */
    .radial-menu-wrapper {
      position: fixed;
      bottom: ${START_POSITION.bottom};
      right: ${START_POSITION.right};
      width: 60px;
      height: 60px;
      z-index: 9999;
      --black: #000000;
      --night-rider: #2e2e2e;
      --eer-black: #1b1b1b;
      --accent: #ffffff;
      --red: #ff3b30;
      transform: translate(0, 0);
      transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    .radial-menu-trigger { display: none; }

    .radial-menu-circle {
      display: block;
      position: relative;
      z-index: 98;
      height: 60px;
      width: 60px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 3px solid var(--red);
      box-shadow: 0 6px 10px 0 rgba(0,0,0,0.3);
      transition: 0.2s;
      cursor: pointer;
    }
    .radial-menu-circle:active {
      transform: scale(0.9);
    }
    .radial-menu-trigger:checked ~ .radial-menu-circle {
      background-color: rgba(0, 0, 0, 0.55);
    }

    .radial-menu-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .radial-menu-icon .line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      border-radius: 10em;
      background: var(--red);
      transition: transform 700ms ease, opacity 700ms ease, top 700ms ease;
      transition-delay: 0.45s;
    }
    .radial-menu-icon .line-1 { top: 3px; }
    .radial-menu-icon .line-2 { top: 10px; }
    .radial-menu-icon .line-3 { top: 17px; }

    .radial-menu-trigger:checked ~ .radial-menu-circle .radial-menu-icon .line-1 {
      top: 10px;
      transform: rotate(45deg);
    }
    .radial-menu-trigger:checked ~ .radial-menu-circle .radial-menu-icon .line-2 {
      opacity: 0;
    }
    .radial-menu-trigger:checked ~ .radial-menu-circle .radial-menu-icon .line-3 {
      top: 10px;
      transform: rotate(-45deg);
    }

    .radial-menu-subs {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 60px;
      pointer-events: none;
      perspective: 800px;
    }

    /* Sub-circles (72px) with a red outline. Centered inside the 60px wrapper:
       (60-72)/2 = -6px, so the circle's center point stays exactly where it
       was — only the circle itself grows. */
    .radial-menu-sub {
      position: absolute;
      top: -6px;
      left: -6px;
      z-index: 0;
      height: 72px;
      width: 72px;
      border-radius: 50%;
      border: 3px solid var(--red);
      margin: 0;
      padding: 0;
      color: #f3f3f3;
      background-color: var(--eer-black);
      box-shadow: 0 6px 14px 0 rgba(0,0,0,0.35);
      transform: translate(0px, 0px) scale(0.3) rotateY(0deg);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      cursor: pointer;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radial-menu-sub-label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, 6px);
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-family: sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid var(--red);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 5;
    }
    .radial-menu-sub:hover .radial-menu-sub-label {
      opacity: 1;
      transform: translate(-50%, 10px);
    }
    .radial-menu-sub svg {
      width: 32px;
      height: 32px;
      fill: var(--red);
      pointer-events: none;
    }
    .radial-menu-sub:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 6px 14px 0 rgba(0,0,0,0.35);
    }

    .radial-menu-trigger:checked ~ .radial-menu-subs { pointer-events: auto; }
    .radial-menu-trigger:checked ~ .radial-menu-subs .radial-menu-sub { pointer-events: auto; }
    .radial-menu-trigger:checked ~ .radial-menu-subs .radial-menu-mini { pointer-events: auto; }

       of 130px), landing it visually in the gap between the center trigger
       circle and the Games sub-circle. Centered inside the 60px wrapper:
       (60-42)/2 = 9px. Pops out slightly before the main ring. */
    .radial-menu-mini {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 1;
      height: 42px;
      width: 42px;
      border-radius: 50%;
      border: 2px solid var(--red);
      margin: 0;
      padding: 0;
      color: #f3f3f3;
      background-color: var(--eer-black);
      box-shadow: 0 4px 10px 0 rgba(0,0,0,0.35);
      transform: translate(0px, 0px) scale(0.3) rotateY(0deg);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      cursor: pointer;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radial-menu-mini svg {
      width: 20px;
      height: 20px;
      fill: var(--red);
      pointer-events: none;
    }
    .radial-menu-mini img.radial-account-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }
    .radial-menu-mini:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 4px 10px 0 rgba(0,0,0,0.35);
    }
    .radial-menu-mini .radial-menu-sub-label {
      font-size: 11px;
      padding: 3px 7px;
      top: auto;
      bottom: 100%;
      transform: translate(-50%, -6px);
      z-index: 150; /* clear of the center trigger circle's z-index: 98 */
    }
    .radial-menu-mini:hover .radial-menu-sub-label {
      opacity: 1;
      transform: translate(-50%, -10px);
    }
    .radial-menu-trigger:checked ~ .radial-menu-subs .radial-menu-mini {
      transform: translate(43.8px, -43.8px) scale(1) rotateY(720deg);
      opacity: 1;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      transition-delay: 1.05s;
    }

    /* ======================================================================
       Account sub-menu mode — entered by clicking the Account avatar while
       signed in. The 8 main ring items fade out (handled via inline styles
       in JS), the avatar morphs into the center, then this back button and
       secondary ring reveal themselves. Kept as standalone classes (not
       reusing .radial-menu-sub/.radial-menu-mini's :checked selectors) so
       visibility is driven purely by JS toggling ".visible" — no CSS
       specificity fights with the main ring's open/close rules.
       ====================================================================== */
    .radial-menu-backbtn {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 5;
      height: 42px;
      width: 42px;
      border-radius: 50%;
      border: 2px solid var(--red);
      background-color: var(--eer-black);
      box-shadow: 0 4px 10px 0 rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translate(0px, 0px) scale(0.3);
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }
    .radial-menu-backbtn:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 4px 10px 0 rgba(0,0,0,0.35);
    }
    .radial-menu-backbtn.visible {
      opacity: 1;
      transform: translate(43.8px, -43.8px) scale(1);
      pointer-events: auto;
    }
    .radial-menu-backbtn-icon { width: 18px; height: 14px; position: relative; }
    .radial-menu-backbtn-icon span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      border-radius: 10em;
      background: var(--red);
    }
    .radial-menu-backbtn-icon span:nth-child(1) { top: 0; }
    .radial-menu-backbtn-icon span:nth-child(2) { top: 6px; }
    .radial-menu-backbtn-icon span:nth-child(3) { top: 12px; }

    .radial-menu-account-subs {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 60px;
      pointer-events: none;
      perspective: 800px;
    }
    .acc-sub-item {
      position: absolute;
      top: -6px;
      left: -6px;
      z-index: 0;
      height: 72px;
      width: 72px;
      border-radius: 50%;
      border: 3px solid var(--red);

      box-shadow: 0 6px 14px 0 rgba(0,0,0,0.35);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translate(0px, 0px) scale(0.3) rotateY(0deg);
      pointer-events: none;
      cursor: default;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }

      width: 30px;
      height: 30px;

    }
    .acc-sub-item svg path:not([fill]) {
      fill: var(--red);
    }
    .acc-sub-item.acc-sub-active { cursor: pointer; }
    .acc-sub-item.acc-sub-active:hover {
      background-color: var(--black);
      box-shadow: 0 0 0 2px var(--red), 0 6px 14px 0 rgba(0,0,0,0.35);
    }
    .acc-sub-item.acc-sub-active:hover .radial-menu-sub-label {
      opacity: 1;
      transform: translate(-50%, 10px);
    }
    .radial-menu-account-subs.visible .acc-sub-item { opacity: 1; }
    .radial-menu-account-subs.visible .acc-sub-item.acc-sub-active { pointer-events: auto; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(1) { transform: translate(0px, -130px) scale(1) rotateY(720deg); transition-delay: 0.00s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(2) { transform: translate(92px, -92px) scale(1) rotateY(720deg); transition-delay: 0.07s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(3) { transform: translate(130px, 0px) scale(1) rotateY(720deg); transition-delay: 0.14s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(4) { transform: translate(92px, 92px) scale(1) rotateY(720deg); transition-delay: 0.21s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(5) { transform: translate(0px, 130px) scale(1) rotateY(720deg); transition-delay: 0.28s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(6) { transform: translate(-92px, 92px) scale(1) rotateY(720deg); transition-delay: 0.35s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(7) { transform: translate(-130px, 0px) scale(1) rotateY(720deg); transition-delay: 0.42s; }
    .radial-menu-account-subs.visible .acc-sub-item:nth-child(8) { transform: translate(-92px, -92px) scale(1) rotateY(720deg); transition-delay: 0.49s; }

    /* ======================================================================

      slot.addEventListener("click", (e) => {
        e.stopPropagation();
        AccountWidget.openCallLogModal();
        closeMenu();
      });
    } else {
      slot.className = "acc-sub-item";
      slot.disabled = true;
      slot.tabIndex = -1;
      slot.setAttribute("aria-hidden", "true");
    }
    accountSubRing.appendChild(slot);
  }

  function enterAccountMode() {
    // 1. fade the 8 main ring items out
    subs.querySelectorAll(".radial-menu-sub").forEach((btn) => {
      btn.style.transition = "opacity 0.3s ease";
      btn.style.opacity = "0";
      btn.style.pointerEvents = "none";
    });

    // 2. hide the center X — the avatar is about to take its place
    label.style.transition = "opacity 0.3s ease";
    label.style.opacity = "0";
    label.style.pointerEvents = "none";

    // 3. move + enlarge the avatar into the center
    accountMiniBtn.style.transition = "transform 0.45s cubic-bezier(0.65, 0, 0.35, 1)";
    accountMiniBtn.style.transform = "translate(0px, 0px) scale(1.4286)";
    accountMiniBtn.style.zIndex = "200";

    // 4. once it lands, reveal the back button + the account sub-ring
    window.setTimeout(() => {
      backToMenuBtn.classList.add("visible");
      accountSubRing.classList.add("visible");
    }, 460);
  }

  function exitAccountMode() {
    backToMenuBtn.classList.remove("visible");
    accountSubRing.classList.remove("visible");

    accountMiniBtn.style.transform = ""; // release back to the CSS-defined ring position
    accountMiniBtn.style.zIndex = "";

    window.setTimeout(() => {
      subs.querySelectorAll(".radial-menu-sub").forEach((btn) => {
        btn.style.opacity = "";
        btn.style.pointerEvents = "";
      });
      label.style.opacity = "";
      label.style.pointerEvents = "";
    }, 300);
  }

  wrapper.appendChild(trigger);
  wrapper.appendChild(label);
  wrapper.appendChild(subs);
  wrapper.appendChild(accountSubRing);
  document.body.appendChild(overlay);
  document.body.appendChild(wrapper);

  // Computes how far the wrapper needs to move (via transform) so its
  // center lands on the viewport center, starting from wherever it
  // currently sits (its resting bottom-right position).
  function getCenterOffset() {
    const rect = wrapper.getBoundingClientRect();
    // Undo any transform currently applied so we measure the true resting position.
    const currentTransform = wrapper.style.transform;
    wrapper.style.transition = "none";
    wrapper.style.transform = "translate(0px, 0px)";
    const restRect = wrapper.getBoundingClientRect();
    wrapper.style.transform = currentTransform;
    // Force reflow, then restore the transition for the actual animated move.
    void wrapper.offsetWidth;
    wrapper.style.transition = "";

    const restCenterX = restRect.left + restRect.width / 2;
    const restCenterY = restRect.top + restRect.height / 2;
    const viewportCenterX = window.innerWidth / 2;
    const viewportCenterY = window.innerHeight / 2;

    return {
      dx: viewportCenterX - restCenterX,
      dy: viewportCenterY - restCenterY,
    };
  }

  function openMenu() {
    const { dx, dy } = getCenterOffset();
    wrapper.style.transform = `translate(${dx}px, ${dy}px)`;
    trigger.checked = true;
    overlay.classList.add("active");
  }

  function closeMenu() {
    wrapper.style.transform = "translate(0px, 0px)";
    trigger.checked = false;
    overlay.classList.remove("active");

    // Instantly reset account sub-menu state (no animation — the whole
    // menu is already collapsing) so the next open starts from scratch.
    backToMenuBtn.classList.remove("visible");
    accountSubRing.classList.remove("visible");
    accountMiniBtn.style.transition = "none";
    accountMiniBtn.style.transform = "";
    accountMiniBtn.style.zIndex = "";
    subs.querySelectorAll(".radial-menu-sub").forEach((btn) => {
      btn.style.transition = "none";
      btn.style.opacity = "";
      btn.style.pointerEvents = "";
    });
    label.style.transition = "none";
    label.style.opacity = "";
    label.style.pointerEvents = "";
    // Restore transitions on the next frame so future opens/account-mode
    // entries animate normally again.
    requestAnimationFrame(() => {
      accountMiniBtn.style.transition = "";
      subs.querySelectorAll(".radial-menu-sub").forEach((btn) => { btn.style.transition = ""; });
      label.style.transition = "";
    });
  }

  label.addEventListener("click", (e) => {
    e.preventDefault();
    trigger.checked ? closeMenu() : openMenu();
  });

  overlay.addEventListener("click", closeMenu);

  // Keep the menu centered correctly if the window is resized while open.
  window.addEventListener("resize", () => {
    if (trigger.checked) {
      const { dx, dy } = getCenterOffset();
      wrapper.style.transform = `translate(${dx}px, ${dy}px)`;
    }
  });

  // ==========================================================================
  // AccountWidget: top-right pill button + sign in/create account modal +
  // dropdown (friends list / sign out), talks to the Stratus account API.
  // ==========================================================================
  const AccountWidget = (function () {
    let currentUser = null; // profile object, or null when signed out
    let pendingIconDataUrl = null; // for the create-account form

    // Bearer token, not the cookie, is what actually survives page reloads
    // cross-site — browsers increasingly block third-party cookies outright
    // (Safari ITP, Chrome's rollout, Firefox ETP), regardless of SameSite.
    const TOKEN_STORAGE_KEY = "stratusSessionToken";
    let sessionToken = null;
    try { sessionToken = localStorage.getItem(TOKEN_STORAGE_KEY); } catch (e) { sessionToken = null; }

    function setSessionToken(token) {
      sessionToken = token || null;
      try {
        if (token) localStorage.setItem(TOKEN_STORAGE_KEY, token);
        else localStorage.removeItem(TOKEN_STORAGE_KEY);
      } catch (e) { /* storage unavailable — token still works for this tab's session */ }
    }

    // ---- API helpers ----
    async function apiFetch(path, opts = {}) {
      try {
        const headers = { "content-type": "application/json" };
        if (sessionToken) headers["Authorization"] = "Bearer " + sessionToken;
        const res = await fetch(ACCOUNT_API_BASE + path, {
          credentials: "include", // harmless to keep; still lets same-origin cookie flow work
          headers,
          ...opts,
        });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, status: res.status, data };
      } catch (e) {
        return { ok: false, status: 0, data: { error: "Network error reaching the account server" } };
      }
    }

    function resizeImage(file, maxSize = 256, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => (img.src = e.target.result);
        reader.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---- DOM: top-right widget ----
    const widget = document.createElement("div");
    widget.className = "acct-widget";

    const button = document.createElement("div");
    button.className = "acct-button";
    button.innerHTML = `<span class="acct-label">Sign in</span>`;
    widget.appendChild(button);

    const dropdown = document.createElement("div");
    dropdown.className = "acct-dropdown";
    // Stop clicks inside the dropdown (Friends, Sign out, Back, etc.) from
    // bubbling to the document-level "click outside closes it" listener below.
    dropdown.addEventListener("click", (e) => e.stopPropagation());
    widget.appendChild(dropdown);

    document.body.appendChild(widget);

    // ---- DOM: modal (sign in / create account) ----
    const modalOverlay = document.createElement("div");
    modalOverlay.className = "acct-modal-overlay";
    modalOverlay.innerHTML = `
      <div class="acct-modal">
        <button class="acct-close-x" type="button" aria-label="Close">&times;</button>

      </div>

    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();

    function openModal() { modalOverlay.classList.add("open"); }
    function closeModal() { modalOverlay.classList.remove("open"); }

    function showMsg(el, text, isError) {
      if (!el) return;
      el.textContent = text || "";
      el.className = "acct-modal-msg " + (isError ? "error" : "ok");
      el.style.display = text ? "block" : "none";

    // ---- Sign-in form ----
    function renderLoginForm() {
      pendingIconDataUrl = null;
      modalBody.innerHTML = `
        <h3>Sign in</h3>
        <p class="acct-modal-sub">Use your account name or email.</p>
        <label>Account name or email</label>
        <input type="text" id="acctLoginId" autocomplete="username" />

          method: "POST",

    // ---- Create account form ----
    function renderRegisterForm() {
      pendingIconDataUrl = null;
      modalBody.innerHTML = `
        <h3>Create account</h3>
        <p class="acct-modal-sub">5-15 char name, and a 5-8 char password with a letter + number.</p>
        <label>Account name</label>
        <input type="text" id="acctRegName" autocomplete="username" />

        <input type="email" id="acctRegEmail" autocomplete="email" />
        <label>Password</label>
        <input type="password" id="acctRegPw" autocomplete="new-password" />

          <span style="font-size:12.5px;color:#9a9a9a">Icon preview</span>
        </div>
        <div class="acct-modal-msg" style="display:none"></div>
        <button class="acct-primary-btn" id="acctRegBtn">Create account</button>
        <div class="acct-switch-row">Already have one? <a id="acctGoLogin">Sign in</a></div>
      `;
      const msgEl = modalBody.querySelector(".acct-modal-msg");
      modalBody.querySelector("#acctGoLogin").onclick = renderLoginForm;

      modalBody.querySelector("#acctRegIcon").onchange = async () => {
        const file = modalBody.querySelector("#acctRegIcon").files[0];
        if (!file) { pendingIconDataUrl = null; return; }
        if (file.size > 2 * 1024 * 1024) {
          showMsg(msgEl, "Icon must be under 2MB", true);
          modalBody.querySelector("#acctRegIcon").value = "";
          return;
        }
        pendingIconDataUrl = await resizeImage(file);
        const previewRow = modalBody.querySelector(".acct-preview-row");
        previewRow.style.display = "flex";
        modalBody.querySelector("#acctRegPreviewImg").src = pendingIconDataUrl;
      };

      modalBody.querySelector("#acctRegBtn").onclick = async () => {
        const accountName = modalBody.querySelector("#acctRegName").value.trim();
        const email = modalBody.querySelector("#acctRegEmail").value.trim();
        const password = modalBody.querySelector("#acctRegPw").value;

        if (!/^[A-Za-z0-9_-]{5,15}$/.test(accountName)) {
          return showMsg(msgEl, "Account name must be 5-15 chars (letters, numbers, _ or -)", true);
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          return showMsg(msgEl, "Enter a valid email address", true);
        }
        if (password.length < 5 || password.length > 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
          return showMsg(msgEl, "Password must be 5-8 chars with a letter and a number", true);
        }

        const btn = modalBody.querySelector("#acctRegBtn");
        btn.disabled = true;
        const { ok, data } = await apiFetch("/api/register", {
          method: "POST",
          body: JSON.stringify({ accountName, email, password, icon: pendingIconDataUrl }),
        });
        btn.disabled = false;
        if (!ok) return showMsg(msgEl, data.error || "Could not create account", true);
        currentUser = data.profile;
        setSessionToken(data.token);
        closeModal();
        render();
        connectNotifications();
      };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ---- Friends modal ----

    addFriendBtn.onclick = async () => {

    async function loadFriendsModal() {

      friendsBodyEl.innerHTML = html;

    // ---- Messages modal ----

    chatModalOverlay.innerHTML = `

    function formatCallMeta(entry) {
      const mins = Math.floor((entry.durationMs || 0) / 60000);

      const durStr = entry.durationMs ? `${mins}:${String(secs).padStart(2, "0")}` : null;
      const when = new Date(entry.ts).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      const arrow = entry.direction === "incoming" ? "↙" : "↗";
      let label;
      if (entry.status === "missed" || entry.status === "no-answer") label = "Missed";
      else if (entry.status === "declined") label = "Declined";
      else if (entry.status === "canceled") label = "Canceled";
      else label = durStr ? `${durStr}` : "Completed";
      return { label, when, arrow, missed: entry.status === "missed" || entry.status === "no-answer" || entry.status === "declined" };

    // Live notifications socket - lets us receive "a friend is calling" pushes,
    // declines, and hangups in real time. Reconnects automatically while

    // carry an Authorization header.
    // ==========================================================================
    let notifySocket = null;
    let notifyReconnectTimer = null;

    function connectNotifications() {
      if (!sessionToken) return;
      if (notifySocket && (notifySocket.readyState === WebSocket.OPEN || notifySocket.readyState === WebSocket.CONNECTING)) return;
      try {
        notifySocket = new WebSocket(`${ACCOUNT_WS_BASE}/api/notifications?token=${encodeURIComponent(sessionToken)}`);
      } catch (e) {
        return;
      }
      notifySocket.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }
        if (msg.type === "call" && msg.data && msg.data.from) {
          handleIncomingCallPush(msg.data.from);

        if (msg.type === "call-declined" && msg.data && msg.data.from === callFriendId && callState === "calling") {

      };
      notifySocket.onclose = () => {
        notifySocket = null;
        if (currentUser && !notifyReconnectTimer) {
          notifyReconnectTimer = setTimeout(() => {
            notifyReconnectTimer = null;
            connectNotifications();
          }, 3000);
        }
      };
      notifySocket.onerror = () => {
        try { notifySocket.close(); } catch (err) {}
      };
    }

    function disconnectNotifications() {

    // ==========================================================================
    // Ringtone - a small WebAudio-generated two-tone chime, looped, so there's
    // no external audio asset to host/fetch. Plays while calling/ringing,
    // stops the instant the call connects, is declined, or ends.
    // ==========================================================================
    let ringAudioCtx = null;
    let ringLoopTimer = null;
    let ringOscillators = [];

    function playRingtoneOnce() {
      if (!ringAudioCtx) return;
      const now = ringAudioCtx.currentTime;
      [820, 660].forEach((freq, i) => {
        const osc = ringAudioCtx.createOscillator();
        const gain = ringAudioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + i * 0.28);
        gain.gain.linearRampToValueAtTime(0.11, now + i * 0.28 + 0.03);
        gain.gain.linearRampToValueAtTime(0, now + i * 0.28 + 0.24);
        osc.connect(gain);
        gain.connect(ringAudioCtx.destination);
        osc.start(now + i * 0.28);
        osc.stop(now + i * 0.28 + 0.26);
        ringOscillators.push(osc);
      });
    }

    function startRingtone() {
      stopRingtone();
      try {
        ringAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        return;
      }
      playRingtoneOnce();
      ringLoopTimer = setInterval(playRingtoneOnce, 2000);
    }

    function stopRingtone() {
      if (ringLoopTimer) { clearInterval(ringLoopTimer); ringLoopTimer = null; }
      ringOscillators = [];
      if (ringAudioCtx) {
        try { ringAudioCtx.close(); } catch (e) {}
        ringAudioCtx = null;

    // ==========================================================================
    // Voice/video calls - real WebRTC, signaled through the /api/call/:friendId
    // relay (Thread Durable Object). The relay only ever sees SDP offers/
    // answers, ICE candidates, and small call-control messages; the actual
    // media flows directly between the two browsers once the handshake
    // completes. This uses the "perfect negotiation" pattern so tracks can be
    // added/removed at any time (camera on/off, screen share on/off) without
    // hand-rolled offer/answer bookkeeping, and ICE restarts fall out of the
    // same code path for free when the connection drops and recovers.
    //
    // NOTE ON SCOPE: this relay supports exactly two participants per call
    // (it's a 1:1 mesh, not an SFU). A true Discord-style group call with
    // many participants would need a real media server (SFU) sitting in
    // front of the Worker - that's a materially bigger infrastructure piece
    // than a Durable Object can provide on its own, so it's out of scope
    // here. Everything else - video, screen share, mute, deafen, speaking
    // indicators, reconnect/ICE-restart, dynamic TURN, ringtone, call
    // history, and a minimizable floating call window - is implemented.
    // ==========================================================================

    let cachedIceServers = null;
    let cachedIceServersAt = 0;
    let lastFetchedIceServers = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
    ];
    const ICE_SERVERS_CACHE_MS = 20 * 60 * 1000; // well under Cloudflare's 1hr credential TTL
    async function fetchIceServers() {
      // Only ever cache a servers list that actually contains a TURN entry.
      // Caching a STUN-only fallback (e.g. from a transient network error,
      // or from testing before TURN secrets were deployed) would otherwise
      // stick around for the rest of the page session even after the real
      // servers become available - every call in that tab would silently
      // keep using STUN-only until a hard refresh.
      if (cachedIceServers && Date.now() - cachedIceServersAt < ICE_SERVERS_CACHE_MS) {
        lastFetchedIceServers = cachedIceServers;
        return cachedIceServers;
      }
      const fallback = [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
      ];
      const { ok, data } = await apiFetch("/api/ice-servers");
      const servers = ok && Array.isArray(data.iceServers) && data.iceServers.length ? data.iceServers : fallback;
      const hasTurn = servers.some((s) => [].concat(s.urls || []).some((u) => /^turns?:/i.test(u)));

      // eslint-disable-next-line no-console
      console.log(
        "[call] ICE servers:", hasTurn ? "TURN configured ✓" : "STUN-only (no TURN - calls across strict NATs will likely fail)",
        servers
      );
      if (!ok) console.warn("[call] /api/ice-servers request failed, using STUN-only fallback:", data);

      lastFetchedIceServers = servers;
      if (hasTurn) {
        cachedIceServers = servers;
        cachedIceServersAt = Date.now();
      } else {
        cachedIceServers = null; // don't cache a bad/fallback result - retry fresh next call
      }
      return servers;
    }

    let callSocket = null;
    let peerConnection = null;
    let localStream = null; // mic (+ camera track once enabled)
    let cameraTrack = null;
    let screenTrack = null;
    let videoSender = null;
    let makingOffer = false;
    let ignoreOffer = false;
    let callState = "idle"; // idle | calling | ringing | active
    let callFriendId = null;
    let callFriendName = "";
    let callFriendIcon = "";
    let callIsCaller = false; // caller = impolite peer, callee = polite peer
    let callTimerInterval = null;

    // ---- Race-condition fix ----
    // The relay never queues messages - it only forwards to sockets that
    // are ACTUALLY connected right now. The caller's socket connects well
    // before the callee's (the callee only joins once they hit "Accept"),
    // so if the caller creates its WebRTC offer immediately on socket-open,
    // that offer is sent into an empty room and silently lost. The callee
    // then joins, sends its own offer, and the caller (being the "impolite"
    // peer in perfect negotiation) ignores it as a collision - both sides
    // sit there forever with signalingState stuck, which is exactly the
    // "stuck on Connecting until it auto-hangs-up" symptom.
    //
    // Fix: don't create the RTCPeerConnection / add local tracks (which is
    // what triggers the first offer via onnegotiationneeded) until we've
    // actually observed BOTH participants present in the relay's presence
    // broadcast. Any offer/answer/candidate that somehow still arrives
    // before the peer connection exists gets queued and replayed once it
    // does, instead of being dropped.
    let bothPresent = false;
    let pendingSignaling = [];
    let iceCandidateQueue = [];

    // ---- Simple draggable helper, reused for the local PiP tile and the
    // minimized floating call bar. ----
    function makeDraggable(handle, moveTarget) {
      let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
      handle.addEventListener("mousedown", (e) => {
        dragging = true;
        moveTarget.classList.add("dragging");
        startX = e.clientX; startY = e.clientY;
        const rect = moveTarget.getBoundingClientRect();
        origX = rect.left; origY = rect.top;
        e.preventDefault();
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const nx = Math.max(4, Math.min(window.innerWidth - moveTarget.offsetWidth - 4, origX + (e.clientX - startX)));
        const ny = Math.max(4, Math.min(window.innerHeight - moveTarget.offsetHeight - 4, origY + (e.clientY - startY)));
        moveTarget.style.left = nx + "px";
        moveTarget.style.top = ny + "px";
        moveTarget.style.right = "auto";
        moveTarget.style.bottom = "auto";
      });
      window.addEventListener("mouseup", () => {
        if (dragging) { dragging = false; moveTarget.classList.remove("dragging"); }
      });

      callRemoteVideoEl.classList.add("acct-call-video-hidden");
      callPlaceholderEl.style.display = "flex";
      callLocalTileEl.classList.add("acct-call-video-off");
      callBar.classList.remove("visible");
      callModalOverlay.classList.add("open");
    }
    function closeCallModal() {
      callModalOverlay.classList.remove("open");
      callBar.classList.remove("visible");
      if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
    }

    function setCallStatus(text, quality) {
      callStatusEl.textContent = text;
      callBarTimeEl.textContent = text;
      callStatusEl.classList.toggle("acct-call-active", quality === "good");
      const dotClass = { good: "", fair: "acct-quality-fair", poor: "acct-quality-poor", reconnecting: "acct-quality-reconnecting" }[quality] || "";
      callQualityDotEl.className = "acct-call-quality-dot " + dotClass;
      callQualityTextEl.textContent = { good: "Connected", fair: "Fair connection", poor: "Poor connection", reconnecting: "Connecting" }[quality] || "";
    }

    function startCallTimer() {
      callStartedAt = Date.now();
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - callStartedAt) / 1000);
        const m = String(Math.floor(secs / 60)).padStart(2, "0");
        const s = String(secs % 60).padStart(2, "0");
        setCallStatus(`${m}:${s}`, currentQuality || "good");
      }, 1000);
    }
    function callDurationMs() {
      return callStartedAt ? Date.now() - callStartedAt : 0;
    }

    // ---- Mute / deafen / video / screen share ----
    function toggleMute() {
      if (!localStream) return;
      callMuted = !callMuted;
      localStream.getAudioTracks().forEach((t) => { t.enabled = !callMuted; });
      callMuteBtnEl.classList.toggle("acct-call-muted", callMuted);
    }

    function toggleDeafen() {
      callDeafened = !callDeafened;
      remoteAudioEl.muted = callDeafened;
      callDeafenBtnEl.classList.toggle("acct-call-deafened", callDeafened);
      // Deafening also mutes your own mic, like Discord - talking while you
      // can't hear anyone is rarely intentional. Un-deafening does not
      // automatically un-mute, matching the same convention.
      if (callDeafened && !callMuted) toggleMute();
    }

    async function toggleVideo() {
      if (!peerConnection) return;
      if (callVideoOn && !callScreenOn) {
        disableCamera();
        return;
      }
      try {
        const camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        cameraTrack = camStream.getVideoTracks()[0];
      } catch (e) {
        showToast(`<span>Could not access your camera</span>`, 4000);
        return;
      }
      if (callScreenOn) stopScreenTrackOnly();
      applyVideoTrack(cameraTrack, false);
      callVideoOn = true;
      callVideoBtnEl.classList.add("acct-call-video-on");
      localStream.getVideoTracks().forEach((t) => localStream.removeTrack(t));
      localStream.addTrack(cameraTrack);
      callLocalVideoEl.srcObject = localStream;
      callLocalTileEl.classList.remove("acct-call-video-off");
      startSpeakingMeter(localStream, callLocalTileEl, true);
    }

    function disableCamera() {
      if (cameraTrack) { try { cameraTrack.stop(); } catch (e) {} cameraTrack = null; }
      if (videoSender && peerConnection) { try { peerConnection.removeTrack(videoSender); } catch (e) {} }
      videoSender = null;
      callVideoOn = false;
      callVideoBtnEl.classList.remove("acct-call-video-on");
      callLocalTileEl.classList.add("acct-call-video-off");
      callLocalVideoEl.srcObject = null;
    }

    async function toggleScreenShare() {
      if (callScreenOn) {
        stopScreenTrackOnly();
        if (callVideoOn && cameraTrack) {
          applyVideoTrack(cameraTrack, false);
        } else {
          disableCamera();
        }
        return;
      }
      let screenStream;
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
      } catch (e) {
        return; // user canceled the picker
      }
      screenTrack = screenStream.getVideoTracks()[0];
      screenTrack.addEventListener("ended", () => {
        // user stopped sharing via the browser's own "Stop sharing" UI
        if (callScreenOn) toggleScreenShare();
      });
      applyVideoTrack(screenTrack, true);
      callScreenOn = true;
      callVideoOn = true;
      callScreenBtnEl.classList.add("acct-call-screen-on");
      callVideoBtnEl.classList.add("acct-call-video-on");
      callLocalVideoEl.srcObject = new MediaStream([screenTrack]);
      callLocalTileEl.classList.remove("acct-call-video-off");
    }

    function stopScreenTrackOnly() {
      if (screenTrack) { try { screenTrack.stop(); } catch (e) {} screenTrack = null; }
      callScreenOn = false;
      callScreenBtnEl.classList.remove("acct-call-screen-on");
    }

    // Adds or replaces the single outgoing video track (camera XOR screen -
    // never both at once, matching how most 1:1 call UIs behave). Uses
    // replaceTrack when a sender already exists so switching camera<->screen
    // doesn't require a fresh renegotiation round trip; addTrack (which
    // triggers onnegotiationneeded automatically) only happens the first
    // time video turns on.
    function applyVideoTrack(track, isScreen) {
      if (!peerConnection) return;
      if (videoSender) {
        videoSender.replaceTrack(track);
      } else {
        videoSender = peerConnection.addTrack(track, localStream);
      }
      callLocalVideoEl.srcObject = new MediaStream([track]);
      callLocalTileEl.classList.toggle("acct-call-video-off", false);
      callLocalVideoEl.style.transform = isScreen ? "none" : ""; // don't mirror screen shares
    }

    // ---- Speaking indicators (local + remote) via WebAudio analyser ----
    const speakingMeters = [];
    function startSpeakingMeter(stream, targetEl, isLocal) {
      speakingMeters.forEach((m) => { if (m.el === targetEl) m.stop(); });
      let ctx, analyser, data, raf, stopped = false;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(stream);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        data = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        return;
      }
      function tick() {
        if (stopped) return;
        analyser.getByteFrequencyData(data);
        const avg = data.reduce((a, b) => a + b, 0) / data.length;
        const speaking = avg > 14 && (isLocal ? !callMuted : true);
        targetEl.classList.toggle("acct-call-speaking", speaking);
        raf = requestAnimationFrame(tick);
      }
      tick();
      const stop = () => {
        stopped = true;
        if (raf) cancelAnimationFrame(raf);
        try { ctx.close(); } catch (e) {}
        targetEl.classList.remove("acct-call-speaking");
      };
      speakingMeters.push({ el: targetEl, stop });
    }
    function stopAllSpeakingMeters() {
      speakingMeters.forEach((m) => m.stop());
      speakingMeters.length = 0;
    }

    // ---- Connection quality monitoring (via getStats) ----
    let currentQuality = "reconnecting";
    let statsInterval = null;
    function startStatsMonitor() {
      if (statsInterval) clearInterval(statsInterval);
      let lastBytes = null, lastTs = null;
      statsInterval = setInterval(async () => {
        if (!peerConnection) return;
        try {
          const stats = await peerConnection.getStats();
          let packetsLost = 0, packetsReceived = 0, rtt = null;
          stats.forEach((r) => {
            if (r.type === "inbound-rtp" && !r.isRemote) {
              packetsLost += r.packetsLost || 0;
              packetsReceived += r.packetsReceived || 0;
            }
            if (r.type === "candidate-pair" && r.state === "succeeded" && r.currentRoundTripTime != null) {
              rtt = r.currentRoundTripTime;
            }
          });
          const lossRatio = packetsReceived > 0 ? packetsLost / (packetsLost + packetsReceived) : 0;
          let quality = "good";
          if (rtt !== null && rtt > 0.35) quality = "poor";
          else if (lossRatio > 0.08 || (rtt !== null && rtt > 0.15)) quality = "fair";
          if (callState === "active") {
            currentQuality = quality;
            setCallStatus(callStatusEl.textContent, quality);
          }
        } catch (e) { /* ignore */ }
      }, 3000);
    }
    function stopStatsMonitor() {
      if (statsInterval) { clearInterval(statsInterval); statsInterval = null; }
    }

    function createPeerConnection() {
      // eslint-disable-next-line no-console
      console.log("[call] creating peer connection with ICE servers:", lastFetchedIceServers);
      const pc = new RTCPeerConnection({ iceServers: lastFetchedIceServers, iceCandidatePoolSize: 4 });

      pc.onicecandidate = (event) => {
        if (event.candidate && callSocket && callSocket.readyState === WebSocket.OPEN) {
          callSocket.send(JSON.stringify({ type: "candidate", candidate: event.candidate }));
        }
      };

      // Fires when gathering a candidate from a specific STUN/TURN server
      // fails outright (bad credentials, server unreachable, port blocked,
      // etc). If you see repeated errors here for the turn: urls specifically,
      // that's the smoking gun for "TURN configured but calls still don't
      // connect cross-network" - check TURN_KEY_ID/TURN_KEY_API_TOKEN are
      // correct and that the key hasn't been deleted/rotated in the
      // Cloudflare dashboard.
      pc.addEventListener("icecandidateerror", (event) => {
        console.warn("[call] ICE candidate error:", event.errorCode, event.errorText, event.url);
      });

      pc.addEventListener("iceconnectionstatechange", () => {
        console.log("[call] iceConnectionState:", pc.iceConnectionState);
        if (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed") {
          // Log which candidate pair actually won, so it's obvious whether
          // the connection went direct (host/srflx) or had to relay through
          // TURN - useful for confirming TURN is the thing that saved a
          // cross-network call rather than assuming it worked.
          pc.getStats().then((stats) => {
            stats.forEach((r) => {
              if (r.type === "candidate-pair" && r.state === "succeeded" && r.nominated) {
                const local = stats.get(r.localCandidateId);
                const remote = stats.get(r.remoteCandidateId);
                console.log(
                  "[call] active candidate pair:",
                  local && local.candidateType, "<->", remote && remote.candidateType,
                  (local && local.candidateType === "relay") || (remote && remote.candidateType === "relay") ? "(via TURN relay)" : "(direct)"
                );
              }
            });
          }).catch(() => {});
        }
        if (pc.iceConnectionState === "failed") {
          console.warn("[call] ICE failed - no usable path found between the two browsers. This means TURN either wasn't offered, wasn't reachable, or credentials were rejected. Check the [call] ICE servers log above for whether TURN was configured, and the icecandidateerror warnings for why a specific server failed.");
        }
      });

      // Perfect-negotiation: fires whenever tracks are added/removed and
      // handles re-offering automatically, including for ICE restarts
      // (pc.restartIce() below also triggers this).
      pc.onnegotiationneeded = async () => {
        try {
          makingOffer = true;
          await pc.setLocalDescription();
          if (callSocket && callSocket.readyState === WebSocket.OPEN) {
            callSocket.send(JSON.stringify({ type: pc.localDescription.type, sdp: pc.localDescription }));
          }
        } catch (e) {
          // ignore - a follow-up negotiationneeded will retry
        } finally {
          makingOffer = false;
        }
      };

      pc.ontrack = (event) => {
        remoteStream.addTrack(event.track);
        if (event.track.kind === "video") {
          remoteHasVideo = true;
          callRemoteVideoEl.srcObject = remoteStream;
          callRemoteVideoEl.classList.remove("acct-call-video-hidden");
          callPlaceholderEl.style.display = "none";
          syncBarVideo();
          event.track.addEventListener("ended", () => {
            remoteStream.removeTrack(event.track);
            if (!remoteStream.getVideoTracks().length) {
              remoteHasVideo = false;
              callRemoteVideoEl.classList.add("acct-call-video-hidden");
              callPlaceholderEl.style.display = "flex";
              syncBarVideo();
            }
          });
        } else {
          startSpeakingMeter(new MediaStream([event.track]), callStageEl, false);
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected") {
          if (callState !== "active") {
            callState = "active";
            startCallTimer();
            startStatsMonitor();
            stopRingtone();
          }
          currentQuality = "good";
          if (reconnectTimeout) { clearTimeout(reconnectTimeout); reconnectTimeout = null; }
        }
        if (pc.connectionState === "disconnected") {
          // Transient blips are common (wifi handoff, brief packet loss) -
          // give it a few seconds before actively restarting ICE so a
          // momentary hiccup doesn't cause a visible reconnect cycle.
          setCallStatus("Reconnecting…", "reconnecting");
          if (!reconnectTimeout) {
            reconnectTimeout = setTimeout(() => {
              reconnectTimeout = null;
              if (pc.connectionState === "disconnected" && pc.restartIce) {
                try { pc.restartIce(); } catch (e) {}
              }
            }, 2500);
          }
        }
        if (pc.connectionState === "failed") {
          endCall("Connection failed", "no-answer");
        }
      };

      return pc;
    }

    // ---- Heartbeat so the Thread DO doesn't reap us as a stale socket, and
    // so we can detect the server itself pinging back within a bounded time. ----
    function startCallHeartbeat(socket) {
      const iv = setInterval(() => {
        if (socket.readyState === WebSocket.OPEN) {
          try { socket.send(JSON.stringify({ type: "ping" })); } catch (e) {}
        } else {
          clearInterval(iv);
        }
      }, 15000);
      return iv;
    }

    // Creates the RTCPeerConnection and adds local tracks - but only once
    // we know the other side has actually joined the relay, and only once
    // our own local media is ready. Safe to call multiple times; it's a
    // no-op after the first successful setup for this call session.
    function ensurePeerConnection(socket) {
      if (peerConnection || !localStream || !bothPresent) return;
      peerConnection = createPeerConnection();
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));
      startSpeakingMeter(localStream, callLocalTileEl, true);
      // Anything that arrived before we had a peer connection to hand it to
      // (shouldn't normally happen now, but be defensive) gets replayed.
      const queued = pendingSignaling;
      pendingSignaling = [];
      queued.forEach((m) => handleSignalingMessage(m, socket));
    }

    async function flushIceCandidateQueue() {
      if (!peerConnection || !peerConnection.remoteDescription) return;
      const queued = iceCandidateQueue;
      iceCandidateQueue = [];
      for (const candidate of queued) {
        try { await peerConnection.addIceCandidate(candidate); } catch (err) { /* stale candidate - ignore */ }
      }
    }

    async function handleSignalingMessage(msg, socket) {
      if (!peerConnection) {
        pendingSignaling.push(msg);
        return;
      }

      const polite = !callIsCaller;

      if (msg.type === "offer" || msg.type === "answer") {
        const offerCollision = msg.type === "offer" && (makingOffer || peerConnection.signalingState !== "stable");
        ignoreOffer = !polite && offerCollision;
        if (ignoreOffer) return;

        try {
          if (offerCollision) {
            await Promise.all([
              peerConnection.setLocalDescription({ type: "rollback" }),
              peerConnection.setRemoteDescription(msg.sdp),
            ]);
          } else {
            await peerConnection.setRemoteDescription(msg.sdp);
          }
          await flushIceCandidateQueue();
          if (msg.type === "offer") {
            await peerConnection.setLocalDescription();
            socket.send(JSON.stringify({ type: peerConnection.localDescription.type, sdp: peerConnection.localDescription }));
          }
        } catch (err) {
          // ignore malformed/late descriptions from a stale renegotiation
        }
        return;
      }

      if (msg.type === "candidate" && msg.candidate) {
        if (!peerConnection.remoteDescription) {
          iceCandidateQueue.push(msg.candidate);
          return;
        }
        try { await peerConnection.addIceCandidate(msg.candidate); } catch (err) { /* benign */ }
      }
    }

    function openCallSocket(friendId) {
      const socket = new WebSocket(`${ACCOUNT_WS_BASE}/api/call/${friendId}?token=${encodeURIComponent(sessionToken)}`);
      const heartbeatIv = startCallHeartbeat(socket);

      socket.onmessage = async (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }

        if (msg.type === "server-ping" || msg.type === "pong") return;

        if (msg.type === "presence") {
          const count = (msg.participants && msg.participants.length) || 0;
          bothPresent = count >= 2;
          if (bothPresent) {
            ensurePeerConnection(socket);
          } else if (callState !== "idle") {
            // the other side hasn't necessarily hung up for good (could be a
            // brief reconnect) - the connection-state handler above already
            // manages the "give it a few seconds" grace period once we've
            // connected, so before that this is just a status hint.
            setCallStatus(callIsCaller ? "Ringing…" : "Connecting…", "reconnecting");
          }
          return;
        }

        if (msg.type === "call-full") {
          showToast(`<span>${escapeHtml(callFriendName || "This call")} already has two participants</span>`);
          endCall(null, "canceled");
          return;
        }

        if (msg.type === "offer" || msg.type === "answer" || msg.type === "candidate") {
          await handleSignalingMessage(msg, socket);
        }
      };

      socket.onclose = () => {
        clearInterval(heartbeatIv);
        if (callState !== "idle") endCall("Call ended", "completed");
      };
      socket.onerror = () => {
        try { socket.close(); } catch (err) {}
      };

      return socket;
    }

    async function startOutgoingCall(friendId, friendName, friendIcon) {
      if (callState !== "idle" || !friendId) return;
      hideIncomingCallBanner();
      const mySession = ++callSessionId;
      callIsCaller = true;
      callState = "calling";
      callFriendId = friendId;
      bothPresent = false;
      pendingSignaling = [];
      iceCandidateQueue = [];
      openCallModal(friendName, friendIcon);
      startRingtone(); // ringback tone while the other side's phone "rings"

      noAnswerTimeout = setTimeout(() => {
        if (callSessionId === mySession && callState !== "active") endCall("No answer", "no-answer");
      }, 30000);

      await fetchIceServers();
      if (callSessionId !== mySession) return;

      callSocket = openCallSocket(friendId);
      callSocket.addEventListener("open", async () => {
        if (callSessionId !== mySession) return;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setCallStatus("Microphone access denied", "poor");
          setTimeout(() => endCall(null, "canceled"), 1500);
          return;
        }
        if (callSessionId !== mySession) { localStream.getTracks().forEach((t) => t.stop()); return; }
        // Only actually wires up the RTCPeerConnection once the callee has
        // joined (bothPresent) - see ensurePeerConnection(). Until then we
        // just hold the mic stream ready so there's no extra delay once
        // they accept.
        ensurePeerConnection(callSocket);
      });
    }

    async function acceptIncomingCall() {
      if (!incomingCallFromId || callState !== "idle") return;
      const friendId = incomingCallFromId;
      incomingCallFromId = null;
      const info = await getFriendInfo(friendId);

      const mySession = ++callSessionId;
      callIsCaller = false;
      callState = "ringing";
      callFriendId = friendId;
      bothPresent = false;
      pendingSignaling = [];
      iceCandidateQueue = [];
      openCallModal(info.accountName, info.icon);
      setCallStatus("Connecting…", "reconnecting");

      await fetchIceServers();
      if (callSessionId !== mySession) return;

      callSocket = openCallSocket(friendId);
      callSocket.addEventListener("open", async () => {
        if (callSessionId !== mySession) return;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setCallStatus("Microphone access denied", "poor");
          setTimeout(() => endCall(null, "canceled"), 1500);
          return;
        }
        if (callSessionId !== mySession) { localStream.getTracks().forEach((t) => t.stop()); return; }
        // The caller is already in the room by the time we (the callee)
        // connect, so the relay's presence broadcast on our own join should
        // arrive (or may have already arrived) showing 2 participants -
        // ensurePeerConnection() proceeds as soon as both that and our mic
        // are ready, in whichever order they land.
        ensurePeerConnection(callSocket);
      });
    }

    function endCall(reason, logStatus) {
      if (callState === "idle" && !callSocket && !peerConnection) return;

      const wasActive = callState === "active";
      const direction = callIsCaller ? "outgoing" : "incoming";
      const durationMs = wasActive ? callDurationMs() : 0;
      const finalStatus = logStatus || (wasActive ? "completed" : "canceled");
      if (callFriendId && sessionToken) {
        apiFetch(`/api/call/${callFriendId}/log`, {
          method: "POST",
          body: JSON.stringify({ status: finalStatus, direction, durationMs }),
        }).catch(() => {});
      }

      callSessionId++;
      callState = "idle";
      callIsCaller = false;
      const endedFriendId = callFriendId;
      callFriendId = null;
      makingOffer = false;
      ignoreOffer = false;
      videoSender = null;
      cameraTrack = null;
      screenTrack = null;
      callVideoOn = false;
      callScreenOn = false;
      remoteHasVideo = false;
      bothPresent = false;
      pendingSignaling = [];
      iceCandidateQueue = [];

      if (noAnswerTimeout) { clearTimeout(noAnswerTimeout); noAnswerTimeout = null; }
      if (reconnectTimeout) { clearTimeout(reconnectTimeout); reconnectTimeout = null; }
      stopStatsMonitor();
      stopAllSpeakingMeters();
      stopRingtone();

      if (callSocket) { try { callSocket.close(); } catch (err) {} callSocket = null; }
      if (peerConnection) { try { peerConnection.close(); } catch (err) {} peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      remoteStream.getTracks().forEach((t) => remoteStream.removeTrack(t));
      remoteAudioEl.srcObject = remoteStream;
      callRemoteVideoEl.srcObject = null;

      if (reason) {
        setCallStatus(reason, "poor");
        setTimeout(closeCallModal, 900);
      } else {
        closeCallModal();
      }

      if (finalStatus === "missed" || finalStatus === "no-answer") {
        const info = friendInfoCache[endedFriendId];
        showToast(
          `<img src="${info ? info.icon : ""}" alt="" /><span>Missed call from <b>${escapeHtml(info ? info.accountName : "a friend")}</b></span>`,
          7000
        );
      }
    }

    // ---- Signed-in dropdown menu ----
    function renderDropdownMenu() {
      dropdown.innerHTML = "";
      const friendsBtn = document.createElement("button");
      friendsBtn.type = "button";
      friendsBtn.textContent = "Friends";
      friendsBtn.onclick = () => {
        dropdown.classList.remove("open");
        openFriendsModal();
      };
      dropdown.appendChild(friendsBtn);

      const callsBtn = document.createElement("button");
      callsBtn.type = "button";
      callsBtn.textContent = "Calls";
      callsBtn.onclick = () => {
        dropdown.classList.remove("open");
        openCallLogModal();
      };
      dropdown.appendChild(callsBtn);

      const signOutBtn = document.createElement("button");
      signOutBtn.type = "button";
      signOutBtn.className = "acct-danger";
      signOutBtn.textContent = "Sign out";
      signOutBtn.onclick = async () => {
        await apiFetch("/api/logout", { method: "POST" });
        setSessionToken(null);
        currentUser = null;
        dropdown.classList.remove("open");
        closeChatModal();
        closeMessagesModal();
        closeFriendsModal();
        closeCallLogModal();
        hideIncomingCallBanner();
        endCall(null, "canceled");
        disconnectNotifications();
        render();
      };
      dropdown.appendChild(signOutBtn);
    }

    function toggleDropdown() {
      if (dropdown.classList.contains("open")) {
        dropdown.classList.remove("open");
        return;
      }
      renderDropdownMenu();
      dropdown.classList.add("open");
    }

    document.addEventListener("click", (e) => {
      if (!widget.contains(e.target)) dropdown.classList.remove("open");
    });

    button.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentUser) {
        toggleDropdown();
      } else {
        dropdown.classList.remove("open");
        renderLoginForm();
        openModal();
      }
    });

    // ---- Render (top-right pill + radial menu account mini-button) ----
    function render() {
      if (currentUser) {
        button.innerHTML = `
          <span class="acct-label">${escapeHtml(currentUser.accountName)}</span>
          <img class="acct-avatar" src="${currentUser.icon}" alt="" />
        `;
      } else {
        button.innerHTML = `<span class="acct-label">Sign in</span>`;
        dropdown.classList.remove("open");
      }

      const tooltip = accountMiniBtn.querySelector(".radial-menu-sub-label");
      if (currentUser) {
        accountMiniBtn.innerHTML = `<img class="radial-account-avatar" src="${currentUser.icon}" alt="" />`;
        accountMiniBtn.setAttribute("aria-label", currentUser.accountName);
      } else {
        accountMiniBtn.innerHTML = ACCOUNT_ICON_SVG;
        accountMiniBtn.setAttribute("aria-label", "Account");
      }
      if (tooltip) accountMiniBtn.appendChild(tooltip);
      else {
        const t = document.createElement("span");
        t.className = "radial-menu-sub-label";
        t.textContent = currentUser ? currentUser.accountName : "Account";
        accountMiniBtn.appendChild(t);
      }
    }

    function handleRadialClick() {
      if (currentUser) {
        enterAccountMode(); // outer-scope function — fades the ring, morphs the avatar to center
      } else {
        renderLoginForm();
        openModal();
      }
    }

    async function init() {
      if (!sessionToken) {
        currentUser = null;
        render();
        return;
      }
      const { ok, data } = await apiFetch("/api/me");
      if (ok) {
        currentUser = data.profile;
      } else {
        currentUser = null;
        setSessionToken(null); // stale/expired token — drop it so we don't keep retrying
      }
      render();
      if (currentUser) connectNotifications();
    }

    init();

    return {
      handleRadialClick,
      openFriendsModal,
      openMessagesModal,
      openCallLogModal,
      isSignedIn: () => !!currentUser,
    };
  })();
})();
</script>
